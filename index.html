<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1e6"><title>병현이의 긍정카드 v3.0</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f7f1e6;color:#334335;font-family:system-ui,-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif}button,input{font:inherit}header{max-width:720px;margin:auto;padding:24px 18px 10px;text-align:center}h1{font-size:clamp(23px,5vw,34px);margin:0 0 7px}header p{color:#738171;font-size:13px;margin:0}.tools{max-width:650px;margin:18px auto 12px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}.tools button,.tools input{border:1px solid #d8decf;background:#fffdf8;border-radius:15px;padding:11px 13px;color:#425744}.tools input{width:125px;min-width:0}.wrap{max-width:650px;margin:auto;padding:0 14px 40px}.card{background:#fffdf8;border-radius:26px;overflow:hidden;box-shadow:0 12px 40px #6c66401a;border:1px solid #e9e5d9;transition:opacity .22s ease,transform .22s ease}.card.fade{opacity:0;transform:translateY(7px)}.art{width:100%;aspect-ratio:4/3;display:block;object-fit:cover;background:#e8e4d7}.content{padding:25px 24px 22px}.eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:700;color:#82927d}.title{font-size:clamp(20px,4.5vw,27px);line-height:1.5;margin:11px 0 17px;word-break:keep-all}.body{white-space:pre-line;line-height:2.05;font-size:15px;color:#526153;word-break:keep-all}.music{margin-top:25px;padding:16px;border-radius:15px;background:#f1f5ed}.music strong{display:block;font-size:14px}.music small{display:block;margin-top:5px;color:#72806d;line-height:1.6}.music a{display:inline-block;margin-top:12px;color:#3d6544;text-decoration:underline;text-underline-offset:3px;font-size:14px}.actions{display:flex;gap:10px;margin:15px 0}.actions button{flex:1;padding:15px 10px;border:0;border-radius:16px;cursor:pointer;font-weight:700;background:#dfe9d8;color:#36543a}.actions .primary{background:#779477;color:#fff;flex:1.5}.status{text-align:center;color:#849082;font-size:12px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:16px 0}.grid button{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}.grid button.on{border-color:#668d6b}.grid img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.grid span{display:block;padding:4px;font-size:11px;color:#596a59}footer{max-width:650px;margin:0 auto 25px;padding:0 16px;text-align:center;color:#8b9588;font-size:12px;line-height:1.8}@media(max-width:430px){.content{padding:21px 19px}.grid{gap:5px}.body{font-size:14px}.tools button,.tools input{padding:9px 10px}}
</style></head><body><header><h1>🍀 병현이의 긍정카드</h1><p>오늘의 마음에 어울리는 작은 한 장 · v3.0 / 1차 25장</p></header><div class="tools"><label>받는 사람 <input id="name" maxlength="15" value="병현" aria-label="받는 사람 이름"></label><button id="all">25장 한눈에 보기</button></div><main class="wrap"><article class="card" id="card"><img class="art" id="art" src="images/001.webp" alt="털실 자수 풍경 속 흰 진돗개"><div class="content"><div class="eyebrow" id="meta">001 · 위로</div><h2 class="title" id="title"></h2><div class="body" id="body"></div><section class="music"><strong id="song"></strong><small id="work"></small><a id="musicLink" href="#" target="_blank" rel="noopener noreferrer"></a><small id="verify"></small></section></div></article><div class="actions"><button id="prev">이전</button><button class="primary" id="random">🍀 다른 카드 뽑기</button><button id="next">다음</button></div><div class="status" id="status"></div><section id="gallery" class="grid" hidden aria-label="카드 25장 선택"></section></main><footer>문구와 그림 001~025 · 한국 영화·드라마 연주곡 후보 안내<br>음악은 외부 YouTube에서 열립니다. 공식 링크가 미확인된 곡은 검색 결과로 연결됩니다.</footer><script>
let cards=[],i=0;const el=x=>document.getElementById(x);const q=s=>encodeURIComponent(s);function cleanName(){return el('name').value.trim()||'병현'}function render(){const c=cards[i],m=c.music;el('art').src=c.image;el('art').alt=c.scene_brief;el('meta').textContent=String(c.id).padStart(3,'0')+' · '+c.category;el('title').textContent=c.title;el('body').textContent=c.body;el('song').textContent='♫ '+m.song+' — '+m.artist;el('work').textContent='한국 드라마·영화 OST 후보 · '+m.work;const verified=!!m.youtube_official_url;el('musicLink').href=verified?m.youtube_official_url:'https://www.youtube.com/results?search_query='+q(m.work+' '+m.song+' '+m.artist+' instrumental OST');el('musicLink').textContent=verified?'YouTube 음원 영상 열기 ↗':'YouTube에서 연주곡 검색 ↗';el('verify').textContent=verified?'기존 공식 배포 링크 후보이며 재검증이 필요합니다.':'YouTube 검색 링크입니다. 공식 영상 및 무가사 여부는 검증 전입니다.';el('status').textContent=(i+1)+' / '+cards.length+'장';document.querySelectorAll('#gallery button').forEach((b,k)=>b.classList.toggle('on',k===i))}function go(n){el('card').classList.add('fade');setTimeout(()=>{i=(n+cards.length)%cards.length;render();el('card').classList.remove('fade')},190)}function init(){el('gallery').innerHTML=cards.map((c,k)=>`<button data-i="${k}" aria-label="${c.id}번 카드"><img src="${c.image}" loading="lazy" alt=""><span>${String(c.id).padStart(3,'0')}</span></button>`).join('');el('gallery').addEventListener('click',e=>{let b=e.target.closest('button');if(b)go(+b.dataset.i)});render()}el('random').onclick=()=>go(Math.floor(Math.random()*cards.length));el('prev').onclick=()=>go(i-1);el('next').onclick=()=>go(i+1);el('all').onclick=()=>{el('gallery').hidden=!el('gallery').hidden;el('all').textContent=el('gallery').hidden?'25장 한눈에 보기':'목록 닫기'};el('name').oninput=()=>{if(cards.length)render()};fetch('cards.json').then(r=>{if(!r.ok)throw Error('파일을 읽을 수 없습니다');return r.json()}).then(v=>{cards=v;init()}).catch(()=>{el('title').textContent='카드 데이터를 불러오지 못했습니다.';el('body').textContent='압축을 풀고 GitHub Pages 또는 로컬 웹서버에서 실행해 주세요.'});
</script></body></html>
